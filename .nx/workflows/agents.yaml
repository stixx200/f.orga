# Nx Agent launch templates for f.orga.
# https://nx.dev/docs/kb/launch-templates
#
# linux-medium-js: stock JS agents (typecheck / test / build).
# linux-medium-playwright: Playwright browsers + PostgreSQL 17 for integration and e2e-ci shards.

common-js-init-steps: &common-js-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'
  - name: Restore Node Modules Cache
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
    inputs:
      key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|patches/**|.yarn/patches/**'
      paths: 'node_modules'
      base-branch: 'main'
  - name: Restore Browser Binary Cache
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
    inputs:
      key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|"browsers"'
      paths: |
        '../.cache/ms-playwright'
      base-branch: 'main'
  - name: Install Node
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'
  - name: Install Node Modules
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml'
  - name: Install Browsers (if needed)
    uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-browsers/main.yaml'

launch-templates:
  linux-medium-js:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    env:
      # Nest 12 is ESM; Jest needs the VM modules API to require() those packages.
      NODE_OPTIONS: '--experimental-vm-modules'
    init-steps: *common-js-init-steps

  linux-medium-playwright:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    no-output-timeout: '30m'
    env:
      # Nest 12 is ESM; Jest needs the VM modules API to require() those packages.
      NODE_OPTIONS: '--experimental-vm-modules'
      # So Playwright `reuseExistingServer` is false and e2e-serve force-boots a fresh DB per Atomizer shard.
      CI: 'true'
      TEST_DATABASE_URL: 'postgresql://forga:forga@127.0.0.1:5432/forga'
      FORGA_E2E_DATABASE_URL: 'postgresql://forga:forga@127.0.0.1:5432/forga_e2e'
      FORGA_E2E_URL: 'http://127.0.0.1:3100'
      FORGA_E2E_PORT: '3100'
      FORGA_TOTP_FILE: 'dist/e2e/totp.json'
      FORGA_TOTP_USED_FILE: 'dist/e2e/totp-used.json'
      FORGA_PG_BIN: '/usr/lib/postgresql/17/bin'
      TZ: 'Europe/Berlin'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'
      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|patches/**|.yarn/patches/**'
          paths: 'node_modules'
          base-branch: 'main'
      - name: Restore Browser Binary Cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|"browsers"|playwright'
          paths: |
            ../.cache/ms-playwright
          base-branch: 'main'
      - name: Install Node
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'
      - name: Install Node Modules
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml'
      - name: Install Playwright Chromium
        script: |
          pnpm exec playwright install --with-deps chromium
      - name: Install and start PostgreSQL 17
        script: |
          set -euo pipefail
          # Nx Agent image has no lsb_release; codename from /etc/os-release (ubuntu22.04 → jammy).
          . /etc/os-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q postgresql-17 postgresql-client-17
          if [ -n "${NX_CLOUD_ENV:-}" ]; then
            echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> "$NX_CLOUD_ENV"
            echo "FORGA_PG_BIN=/usr/lib/postgresql/17/bin" >> "$NX_CLOUD_ENV"
          fi
          sudo pg_ctlcluster 17 main start || sudo service postgresql start
          # Password auth for local TCP (integration + e2e).
          echo "host all forga 127.0.0.1/32 scram-sha-256" | sudo tee -a /etc/postgresql/17/main/pg_hba.conf
          sudo pg_ctlcluster 17 main reload || sudo service postgresql reload
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'forga') THEN
              CREATE ROLE forga LOGIN PASSWORD 'forga' SUPERUSER;
            ELSE
              ALTER ROLE forga WITH LOGIN PASSWORD 'forga' SUPERUSER;
            END IF;
          END $$;
          SQL
          if ! sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'forga'" | grep -q 1; then
            sudo -u postgres createdb -O forga forga
          fi
          if ! sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'forga_e2e'" | grep -q 1; then
            sudo -u postgres createdb -O forga forga_e2e
          fi
          pg_isready -h 127.0.0.1
