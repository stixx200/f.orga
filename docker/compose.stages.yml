# Two separate f.orga systems side by side, each with its own database:
#   real system (live data, e.g. from an MP-Feuer transfer)  http://localhost:${FORGA_REAL_PORT:-8080}
#   test system (demo data from `npm run seed`)               http://localhost:${FORGA_TEST_PORT:-8081}
# Start: docker compose -f docker/compose.stages.yml up -d --build   (values in docker/.env, template docker/.env.example)
# The systems share the image, nothing else: data, sessions and settings stay apart.
x-forga: &forga
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: forga:latest
  restart: unless-stopped

x-db: &db
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U forga']
    interval: 5s
    retries: 10

services:
  forga-real:
    <<: *forga
    environment:
      DATABASE_URL: postgresql://forga:${POSTGRES_PASSWORD_REAL:?POSTGRES_PASSWORD_REAL is missing}@db-real:5432/forga
      FORGA_SETUP_TOKEN: ${FORGA_SETUP_TOKEN_REAL:-}
      FORGA_SECURE_COOKIES: ${FORGA_SECURE_COOKIES:-false}
      FORGA_PLUGIN_DIR: /plugins
      FORGA_PLUGIN_KEYS: ${FORGA_PLUGIN_KEYS:-}
    volumes:
      - forga-real-plugins:/plugins
    ports:
      - '${FORGA_REAL_PORT:-8080}:3000'
    depends_on:
      db-real:
        condition: service_healthy

  db-real:
    <<: *db
    environment:
      POSTGRES_USER: forga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_REAL:?POSTGRES_PASSWORD_REAL is missing}
      POSTGRES_DB: forga
    volumes:
      - forga-real-db:/var/lib/postgresql/data

  forga-test:
    <<: *forga
    environment:
      DATABASE_URL: postgresql://forga:${POSTGRES_PASSWORD_TEST:?POSTGRES_PASSWORD_TEST is missing}@db-test:5432/forga
      FORGA_SETUP_TOKEN: ${FORGA_SETUP_TOKEN_TEST:-}
      FORGA_SECURE_COOKIES: ${FORGA_SECURE_COOKIES:-false}
      FORGA_PLUGIN_DIR: /plugins
      FORGA_PLUGIN_KEYS: ${FORGA_PLUGIN_KEYS:-}
    volumes:
      - forga-test-plugins:/plugins
    ports:
      - '${FORGA_TEST_PORT:-8081}:3000'
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    <<: *db
    environment:
      POSTGRES_USER: forga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST:?POSTGRES_PASSWORD_TEST is missing}
      POSTGRES_DB: forga
    volumes:
      - forga-test-db:/var/lib/postgresql/data

volumes:
  forga-real-db:
  forga-real-plugins:
  forga-test-db:
  forga-test-plugins:
