# Two separate f.orga systems side by side, each with its own database:
#   real system (live data, e.g. from an MP-Feuer transfer)  http://localhost:${FORGA_REAL_PORT:-8080}
#   test system (demo data from `npm run seed`)               http://localhost:${FORGA_TEST_PORT:-8081}
# Start: docker compose -f docker/compose.stages.yml up -d --build   (values in docker/.env, template docker/.env.example)
# The systems share the image, nothing else: data, sessions and settings stay apart.
# Own project name, so it does not collide with docker/compose.dev.yml in the same directory.
name: forga-stages

x-forga: &forga
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: forga:latest
  restart: unless-stopped

x-db: &db
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U forga']
    interval: 5s
    retries: 10

services:
  forga-real:
    <<: *forga
    environment:
      # Own role without superuser rights (docker/db/10-app-role.sh).
      DATABASE_URL: postgresql://forga_app:${FORGA_DB_APP_PASSWORD_REAL:?FORGA_DB_APP_PASSWORD_REAL is missing}@db-real:5432/forga
      FORGA_STAGE: production
      FORGA_SETUP_TOKEN: ${FORGA_SETUP_TOKEN_REAL:-}
      FORGA_SECRET_KEY: ${FORGA_SECRET_KEY_REAL:-}
      FORGA_PUBLIC_URL: ${FORGA_PUBLIC_URL_REAL:-}
      FORGA_TRUST_PROXY: ${FORGA_TRUST_PROXY:-}
      FORGA_IMPORT_URL_ALLOW_PRIVATE: ${FORGA_IMPORT_URL_ALLOW_PRIVATE:-false}
      FORGA_SECURE_COOKIES: ${FORGA_SECURE_COOKIES:-false}
      FORGA_PLUGIN_DIR: /plugins
      FORGA_PLUGIN_KEYS: ${FORGA_PLUGIN_KEYS:-}
      # Backups of the real system, apart from those of the test system (FORGA_BACKUP_DIR_REAL: folder on the host).
      FORGA_BACKUP_ROOT: /backups
      FORGA_INSTANCE: real
    volumes:
      - forga-real-plugins:/plugins
      - ${FORGA_BACKUP_DIR_REAL:-forga-real-backups}:/backups
    ports:
      - '${FORGA_REAL_PORT:-8080}:3000'
    depends_on:
      db-real:
        condition: service_healthy

  db-real:
    <<: *db
    environment:
      POSTGRES_USER: forga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_REAL:?POSTGRES_PASSWORD_REAL is missing}
      POSTGRES_DB: forga
      FORGA_DB_APP_PASSWORD: ${FORGA_DB_APP_PASSWORD_REAL:?FORGA_DB_APP_PASSWORD_REAL is missing}
    volumes:
      - forga-real-db:/var/lib/postgresql/data
      - ./db/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro

  forga-test:
    <<: *forga
    environment:
      # Own role without superuser rights (docker/db/10-app-role.sh).
      DATABASE_URL: postgresql://forga_app:${FORGA_DB_APP_PASSWORD_TEST:?FORGA_DB_APP_PASSWORD_TEST is missing}@db-test:5432/forga
      # Demo data only: band on every page, no transfer from MP-Feuer, no import of persons.
      FORGA_STAGE: test
      FORGA_SETUP_TOKEN: ${FORGA_SETUP_TOKEN_TEST:-}
      FORGA_SECRET_KEY: ${FORGA_SECRET_KEY_TEST:-}
      FORGA_PUBLIC_URL: ${FORGA_PUBLIC_URL_TEST:-}
      FORGA_TRUST_PROXY: ${FORGA_TRUST_PROXY:-}
      FORGA_IMPORT_URL_ALLOW_PRIVATE: ${FORGA_IMPORT_URL_ALLOW_PRIVATE:-false}
      FORGA_SECURE_COOKIES: ${FORGA_SECURE_COOKIES:-false}
      FORGA_PLUGIN_DIR: /plugins
      FORGA_PLUGIN_KEYS: ${FORGA_PLUGIN_KEYS:-}
      # Backups of the test system (FORGA_BACKUP_DIR_TEST: folder on the host); no scheduled backups by default.
      FORGA_BACKUP_ROOT: /backups
      FORGA_INSTANCE: test
      FORGA_BACKUP_SCHEDULER: ${FORGA_BACKUP_SCHEDULER_TEST:-off}
    volumes:
      - forga-test-plugins:/plugins
      - ${FORGA_BACKUP_DIR_TEST:-forga-test-backups}:/backups
    ports:
      - '${FORGA_TEST_PORT:-8081}:3000'
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    <<: *db
    environment:
      POSTGRES_USER: forga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST:?POSTGRES_PASSWORD_TEST is missing}
      POSTGRES_DB: forga
      FORGA_DB_APP_PASSWORD: ${FORGA_DB_APP_PASSWORD_TEST:?FORGA_DB_APP_PASSWORD_TEST is missing}
    volumes:
      - forga-test-db:/var/lib/postgresql/data
      - ./db/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro

# Fixed names: the data survives a change of the project name.
volumes:
  forga-real-db:
    name: forga_real_db
  forga-real-plugins:
    name: forga_real_plugins
  forga-real-backups:
    name: forga_real_backups
  forga-test-db:
    name: forga_test_db
  forga-test-plugins:
    name: forga_test_plugins
  forga-test-backups:
    name: forga_test_backups
