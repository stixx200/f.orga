# Database only, for local development.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forga
      POSTGRES_PASSWORD: forga
      POSTGRES_DB: forga
    ports:
      - '5433:5432'
    volumes:
      - forga-dev-db:/var/lib/postgresql/data
volumes:
  forga-dev-db:
