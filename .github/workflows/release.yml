name: Release

# Publishes the versioned image (ghcr.io/stixx200/f.orga:X.Y.Z) for a tag created by `nx release` (vX.Y.Z).
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag must name the version of the server and its commit must be on main (the CI run for it is green then).
      - name: Check tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          server_version=$(node -p "require('./apps/server/package.json').version")
          if [ "$version" != "$server_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $server_version of apps/server" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/stixx200/f.orga:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/stixx200/f.orga
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
