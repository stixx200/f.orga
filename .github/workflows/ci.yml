name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  NX_DAEMON: false

jobs:
  pruefen:
    name: Lint, tests, build, e2e, image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Agents bring Postgres + Playwright via `.nx/workflows`; these mirror the Playwright template for any local step.
      TEST_DATABASE_URL: postgresql://forga:forga@127.0.0.1:5432/forga
      FORGA_E2E_DATABASE_URL: postgresql://forga:forga@127.0.0.1:5432/forga_e2e
      FORGA_E2E_URL: http://127.0.0.1:3100
      FORGA_TOTP_FILE: dist/e2e/totp.json
      FORGA_TOTP_USED_FILE: dist/e2e/totp-used.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      # JS agents for typecheck/test/build; Playwright+Postgres agents for integration and e2e-ci Atomizer shards.
      # Docker stays on this runner (Agents have no Docker daemon).
      # https://nx.dev/ci/features/split-e2e-tasks
      - run: npx nx-cloud@latest start-ci-run --distribute-on=".nx/workflows/distribution.yaml" --stop-agents-after="typecheck,test,build,integration,e2e-ci,docker-build"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint and module boundaries
        run: pnpm run lint
      - name: Typecheck, unit tests, build, integration and e2e-ci
        run: pnpm exec nx affected -t typecheck test build integration e2e-ci --parallel=3
      - name: Typecheck sources (workspace-level)
        run: node tools/typecheck-sources.mjs
      - name: Docker image
        # Local only: Dockerfile rebuilds the app; needs the runner's Docker, not Agents.
        run: pnpm exec nx run @forga/image:docker-build:ci --no-agents
      - name: E2E report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            dist/e2e-report
            dist/e2e-results
            dist/e2e/server.log
          retention-days: 14
          if-no-files-found: ignore
      - run: pnpm exec nx-cloud fix-ci
        if: always()
