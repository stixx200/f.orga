name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  pruefen:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forga
          POSTGRES_PASSWORD: forga
          POSTGRES_DB: forga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forga"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forga:forga@localhost:5432/forga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: PostgreSQL 17 client (pg_dump, pg_restore, psql for the backup module)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Lint and module boundaries
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Integration tests (PostgreSQL)
        run: npm run integration
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: forga:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
